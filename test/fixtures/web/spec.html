<h1>Token Service</h1>
<p>Refresh tokens are rotated on every use, and the previous token is invalidated immediately.</p>
<h2>Retries</h2>
<p>The client MUST retry 3 times with exponential backoff, starting at 200 ms.</p>
<ul>
<li>Idempotent requests only.</li>
<li>Give up after <code>3</code> attempts.</li>
</ul>
