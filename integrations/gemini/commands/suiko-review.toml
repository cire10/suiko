# /suiko-review: start a Suiko round for an existing spec (Gemini CLI custom command).
# Installed by `suiko install` from integrations/gemini/commands/suiko-review.toml; `suiko uninstall` removes it.
description = "Open an HTML or Markdown spec in Suiko, wait for the reviewer's feedback and address it"
prompt = '''
Start a Suiko review round for this file: {{args}}

Follow the "Spec reviews (Suiko)" protocol in your global context file (GEMINI.md). Steps:

1. **Pick the file.** If no path was given above, run `suiko status` to list the tracked docs and ask the user which one to open (or suggest a spec you wrote in this session). The file must be `.md`, `.markdown`, `.html` or `.htm`. Do not create or rewrite it.
2. **Open it.** Run `suiko open "<path>"`. Note the doc id from `tracking … as "<doc>"` and give the user the URL on the `review UI:` line.
3. **Get the review.** If your shell can block for minutes, run `suiko wait <doc> --timeout 10m` (pick a timeout below your shell tool's limit; exit 2 means it timed out, so run it again). Otherwise ask the user to click **Submit review** in the UI and tell you "done", then run `suiko feedback <doc> --include-drafts`.
4. **Handle the packet** as the protocol says: targeted edits only, then `suiko revise <doc> --replies -` with one entry per thread: every answer goes in its thread's reply, where the reviewer reads it in Suiko. Summarise one line per thread for the user and get the next review, until the reviewer approves.
'''
